[project]
name = "groupim-lightgcn-ablation"
version = "0.1.0"
description = "GroupIM + LightGCN ablation: all four datasets, full ablation on one RTX 4080"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
groupim-lightgcn-ablation = "groupim_lightgcn_ablation:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
