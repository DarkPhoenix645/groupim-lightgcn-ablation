<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 Z" fill="#1d4e89"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#ffffff"/>

  <text x="40" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" fill="#111827">GroupIM</text>
  <text x="138" y="42" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#6b7280">user encoder ablation</text>
  <text x="40" y="68" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#4b5563">Member preferences become one group vector, which scores items. LightGCN replaces the encoder. The aggregator, discriminator, and losses stay.</text>

  <rect x="1088" y="26" width="12" height="12" rx="2" fill="#f8fbff" stroke="#1d4e89" stroke-width="1.5"/>
  <text x="1106" y="37" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#374151">Encoder swap</text>
  <rect x="1224" y="26" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1242" y="37" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#374151">Held fixed</text>

  <text x="40" y="108" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" letter-spacing="1.2" fill="#6b7280">FORWARD PASS</text>

  <rect x="40" y="124" width="230" height="328" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">Inputs</text>
  <text x="56" y="186" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827">Member histories</text>
  <text x="56" y="206" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Item vector for each member</text>
  <line x1="56" y1="226" x2="254" y2="226" stroke="#e2e8f0"/>
  <text x="56" y="254" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827">Group mask</text>
  <text x="56" y="274" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Present members only</text>
  <line x1="56" y1="294" x2="254" y2="294" stroke="#e2e8f0"/>
  <rect x="48" y="310" width="4" height="122" rx="2" fill="#1d4e89"/>
  <text x="64" y="338" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d4e89">User-item graph</text>
  <text x="64" y="358" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Train edges plus fold-in</text>
  <text x="64" y="376" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Held-out items stay off</text>
  <text x="64" y="404" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d4e89">Feeds LightGCN only</text>

  <rect x="312" y="124" width="312" height="328" rx="12" fill="#f8fbff" stroke="#1d4e89" stroke-width="1.75"/>
  <text x="328" y="152" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">User preference encoder</text>
  <rect x="540" y="136" width="72" height="20" rx="10" fill="#1d4e89"/>
  <text x="576" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#ffffff">only swap</text>
  <rect x="328" y="174" width="280" height="118" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="344" y="200" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827">MLP</text>
  <text x="344" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Feed-forward net on the</text>
  <text x="344" y="240" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">member's item vector.</text>
  <text x="344" y="268" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b7280">Baseline encoder</text>
  <rect x="328" y="306" width="280" height="126" rx="8" fill="#ffffff" stroke="#1d4e89"/>
  <text x="344" y="332" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" fill="#1d4e89">LightGCN</text>
  <text x="344" y="354" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">K hops on the user-item graph.</text>
  <text x="344" y="372" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Readout is the mean of the</text>
  <text x="344" y="390" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">ID embedding and those K layers.</text>
  <text x="344" y="412" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1d4e89">K is the neighborhood depth</text>

  <rect x="672" y="210" width="168" height="156" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="756" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Member</text>
  <text x="756" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">embeddings</text>
  <text x="756" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">One vector</text>
  <text x="756" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">per member</text>

  <rect x="888" y="210" width="176" height="156" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="976" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Aggregator</text>
  <text x="976" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">attention</text>
  <text x="976" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">maxpool &#183; meanpool</text>
  <text x="976" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">uniform &#183; cosine</text>

  <rect x="1112" y="210" width="248" height="156" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1236" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Group embedding</text>
  <text x="1236" y="286" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">One vector for the group</text>

  <line x1="270" y1="299" x2="304" y2="299" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="270" y1="368" x2="304" y2="368" stroke="#1d4e89" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="624" y1="288" x2="664" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="288" x2="880" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1064" y1="288" x2="1104" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="756" y1="366" x2="756" y2="515" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="768" y="446" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6b7280">members</text>

  <line x1="1236" y1="366" x2="1236" y2="515" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="1148,366 1148,476 1040,476 1040,515" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1094" y="468" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6b7280">group vector</text>

  <rect x="672" y="516" width="392" height="148" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="688" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Discriminator</text>
  <text x="688" y="570" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Scores agreement between the group</text>
  <text x="688" y="588" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">vector and each member vector.</text>
  <text x="688" y="618" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">L_MI</text>
  <text x="724" y="618" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">keeps every member in the group vector.</text>
  <text x="688" y="642" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b7280">Added with weight 1. Held fixed.</text>

  <rect x="1112" y="516" width="248" height="148" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1128" y="546" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Item scores</text>
  <text x="1128" y="570" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">Linear map to every item.</text>
  <text x="1128" y="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">L_G</text>
  <text x="1158" y="598" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">group visits</text>
  <text x="1128" y="618" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">&#955; L_U</text>
  <text x="1172" y="618" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#4b5563">own histories</text>
  <text x="1128" y="642" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b7280">&#955; weights L_U only.</text>

  <rect x="40" y="692" width="1320" height="52" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="723" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="600" fill="#111827">Training order</text>
  <circle cx="180" cy="718" r="9" fill="#111827"/>
  <text x="180" y="722" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#ffffff">1</text>
  <text x="196" y="723" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#374151">User pretraining on individual histories</text>
  <circle cx="500" cy="718" r="9" fill="#111827"/>
  <text x="500" y="722" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#ffffff">2</text>
  <text x="516" y="723" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#374151">Discriminator warmup</text>
  <circle cx="710" cy="718" r="9" fill="#111827"/>
  <text x="710" y="722" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#ffffff">3</text>
  <text x="726" y="723" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#374151">Group training on L_G + &#955; L_U + L_MI</text>
</svg>
